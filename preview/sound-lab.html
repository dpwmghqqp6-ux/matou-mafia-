<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matou Mafia — Sons</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; background:radial-gradient(ellipse at 50% 0%, #2a1c10, #0c0805 70%); color:#efe1c4; font-family:"Avenir Next","Segoe UI",sans-serif; padding:28px 18px 60px; }
    h1 { font-family:"Rockwell","Georgia",serif; letter-spacing:.2em; color:#ffe2a0; text-align:center; font-size:28px; text-shadow:0 0 18px rgba(232,181,74,.5); }
    .sub { text-align:center; opacity:.7; font-size:13px; margin:8px 0 28px; }
    h2 { font-family:"Rockwell","Georgia",serif; letter-spacing:.16em; color:#e8b54a; font-size:15px; margin:30px auto 12px; max-width:1100px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; max-width:1100px; margin:0 auto; }
    .card { border:2px solid rgba(232,181,74,.35); border-radius:10px; padding:16px; background:linear-gradient(180deg,rgba(58,38,18,.55),rgba(20,13,7,.8)); }
    .card.on { border-color:#ffe2a0; box-shadow:0 0 24px rgba(232,181,74,.35); }
    .card h3 { font-family:"Rockwell","Georgia",serif; letter-spacing:.12em; color:#ffe2a0; font-size:16px; margin-bottom:6px; }
    .card p { font-size:12.5px; opacity:.8; margin-bottom:12px; line-height:1.4; }
    .row { display:flex; flex-wrap:wrap; gap:6px; }
    button { font:800 11px "Avenir Next","Segoe UI",sans-serif; letter-spacing:.08em; padding:7px 10px; border-radius:6px; cursor:pointer;
      border:1px solid rgba(232,181,74,.5); background:#2a1c10; color:#ffe2a0; }
    button:hover { background:#3a2814; }
    button.gold { background:linear-gradient(180deg,#e8c078,#8a5a28 55%,#5a3818); color:#1a0f05; border-color:#f0d28a; }
    button.sel { outline:2px solid #ffe2a0; }
    .modes { max-width:1100px; margin:0 auto; display:flex; gap:8px; align-items:center; font-size:12px; }
    .vol { max-width:1100px; margin:14px auto 0; display:flex; gap:18px; font-size:12px; align-items:center; flex-wrap:wrap; }
    a { color:#e8b54a; }
  </style>
</head>
<body>
  <h1>MATOU MAFIA · SOUNDS</h1>
  <p class="sub">Listen to the options, then click "USE IN GAME". You can also change it in the game SETTINGS. <a href="./index.html">Back to game</a></p>

  <h2>MUSIC</h2>
  <div class="grid" id="music"></div>
  <div class="modes" style="margin-top:12px">Mood:
    <button data-mode="base" class="sel">BASE GAME</button><button data-mode="heist">HEIST</button><button data-mode="gold">GOLD RUSH</button>
  </div>
  <div class="vol">
    <label>Music <input type="range" id="mv" min="0" max="100" value="50"></label>
    <label>Sound effects <input type="range" id="sv" min="0" max="100" value="70"></label>
  </div>

  <h2>MACHINE SOUNDS</h2>
  <div class="grid" id="packs"></div>

  <script src="./audio/matou-audio.js"></script>
  <script>
    const A = window.MatouAudio;
    const $ = (id) => document.getElementById(id);
    function render() {
      $("music").innerHTML = Object.entries(A.styles).map(([k, s]) => `
        <div class="card ${A.music===k?"on":""}">
          <h3>${s.label}</h3><p>${s.desc}</p>
          <div class="row">
            <button data-play="${k}">${A.playing===k?"■ STOP":"▶ LISTEN"}</button>
            <button class="gold" data-usemusic="${k}">${A.music===k?"✓ SELECTED":"USE IN GAME"}</button>
          </div>
        </div>`).join("") + `
        <div class="card ${A.music==="off"?"on":""}"><h3>No music</h3><p>Sound effects only.</p>
          <div class="row"><button class="gold" data-usemusic="off">${A.music==="off"?"✓ SELECTED":"USE IN GAME"}</button></div></div>`;
      $("packs").innerHTML = Object.entries(A.packs).map(([k, p]) => `
        <div class="card ${A.pack===k?"on":""}">
          <h3>${p.label}</h3><p>${p.desc}</p>
          <div class="row" style="margin-bottom:10px">${Object.entries(A.EVENTS).map(([e, l]) => `<button data-pack="${k}" data-ev="${e}">${l}</button>`).join("")}</div>
          <div class="row"><button data-demo="${k}">▶ FULL SEQUENCE</button><button class="gold" data-usepack="${k}">${A.pack===k?"✓ SELECTED":"USE IN GAME"}</button></div>
        </div>`).join("");
    }
    function playIn(pack, ev, arg) { const prev = A.pack; A.setPack(pack); A.sfx(ev, arg); A.setPack(prev); }
    function demo(pack) {
      const seq = [["spin",0],["slam",900,0],["slam",1080,1],["slam",1260,2],["scatter",1270,1],["slam",1440,3],["scatter",1450,2],["tease",1500],["slam",2700,4],["scatter",2710,3],["slam",2900,5],["line",3400,0],["coin",3750],["line",4300,1],["bonus",5000],["door",6300],["lock",7400],["collect",8000],["big",9400]];
      seq.forEach(([e, ms, arg]) => setTimeout(() => playIn(pack, e, arg), ms));
    }
    document.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      A.init();
      if (b.dataset.play) { if (A.playing === b.dataset.play) A.stopMusic(); else A.playMusic(b.dataset.play, false); }
      if (b.dataset.usemusic) { if (b.dataset.usemusic === "off") { A.playMusic("off"); } else A.playMusic(b.dataset.usemusic); }
      if (b.dataset.ev) playIn(b.dataset.pack, b.dataset.ev, 2);
      if (b.dataset.demo) demo(b.dataset.demo);
      if (b.dataset.usepack) { A.setPack(b.dataset.usepack); playIn(b.dataset.usepack, "boot"); }
      if (b.dataset.mode) { A.setMode(b.dataset.mode); document.querySelectorAll("[data-mode]").forEach((x) => x.classList.toggle("sel", x === b)); }
      render();
    });
    $("mv").oninput = () => A.setVolumes({ music: $("mv").value / 100 });
    $("sv").oninput = () => A.setVolumes({ sfx: $("sv").value / 100 });
    render();
    if (location.search.includes("mesure")) (async () => {
      const out = [], bad = A.check();
      if (bad.length) out.push("CHECK: " + JSON.stringify(bad));
      for (const k of Object.keys(A.styles)) for (const m of ["base", "heist", "gold"]) {
        const r = await A.measure("music", m === "base" ? k : { toString: () => k, mode: m }, 0, 12);
        out.push(`music ${k}/${m} peak=${r.peak.toFixed(2)} rms=${r.rms.toFixed(3)} nan=${r.nan}`);
      }
      for (const p of Object.keys(A.packs)) for (const e of Object.keys(A.EVENTS)) {
        const r = await A.measure("sfx", { pack: p, ev: e }, 2, e === "big" || e === "bonus" ? 6 : 4);
        out.push(`sfx ${p}/${e} peak=${r.peak.toFixed(2)} rms=${r.rms.toFixed(3)} nan=${r.nan}`);
      }
      const pre = document.createElement("pre"); pre.id = "mesure"; pre.style.cssText = "max-width:1100px;margin:20px auto;font-size:11px";
      pre.textContent = out.join("\n"); document.body.appendChild(pre); console.log(out.join("\n"));
    })().catch((e) => console.error("mesure", e));
  </script>
</body>
</html>
